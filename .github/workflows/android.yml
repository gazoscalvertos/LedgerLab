name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Every merge to main refreshes a "latest" pre-release, so the APK can be grabbed straight from a phone.
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LedgerLab (latest build)
          prerelease: true
          make_latest: false
          body: Debug build of ${{ github.sha }}. Install app-debug.apk on an Android 8.0+ device.
          files: app/build/outputs/apk/debug/app-debug.apk
